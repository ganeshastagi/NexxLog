<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - JobTracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-container">
        <a class="nav-brand" th:href="@{/}">
            <span class="brand-icon">&#128188;</span> JobTracker
        </a>
        <div class="nav-links">
            <span class="nav-hint">Don't have an account?</span>
            <a th:href="@{/register}" class="btn btn-primary">Register</a>
        </div>
    </div>
</nav>

<!-- Auth Card -->
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Welcome back</h1>
            <p>Log in to your JobTracker account</p>
        </div>

        <!-- Success/Error Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <!-- Spring Security error param -->
        <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" id="loginForm" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="username">Email address</label>
                <input
                        type="email"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                />
                <span class="field-error" id="usernameError"></span>
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                    <a th:href="@{/forgot-password}" class="label-link">Forgot password?</a>
                </label>
                <div class="input-wrapper">
                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                    />
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility"
                            onclick="togglePassword('password', this)">&#128065;</button>
                </div>
                <span class="field-error" id="passwordError"></span>
            </div>

            <div class="form-group form-check">
                <input type="checkbox" id="remember-me" name="remember-me" />
                <label for="remember-me">Keep me logged in</label>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Log In</button>
        </form>

        <div class="auth-footer">
            <p>New to JobTracker? <a th:href="@{/register}">Create a free account</a></p>
        </div>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>

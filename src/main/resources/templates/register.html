<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobTracker</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-container">
        <a class="nav-brand" th:href="@{/}">
            <span class="brand-icon">&#128188;</span> JobTracker
        </a>
        <div class="nav-links">
            <span class="nav-hint">Already have an account?</span>
            <a th:href="@{/login}" class="btn btn-outline">Log In</a>
        </div>
    </div>
</nav>

<!-- Auth Card -->
<main class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Create your account</h1>
            <p>Start tracking your job applications today — free forever.</p>
        </div>

        <!-- Validation/Error Messages -->
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <!-- Register Form -->
        <form th:action="@{/register}" th:object="${userDto}" method="post" id="registerForm" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input
                            type="text"
                            id="firstName"
                            th:field="*{firstName}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                            placeholder="Jane"
                            required
                            autocomplete="given-name"
                    />
                    <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                </div>
                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input
                            type="text"
                            id="lastName"
                            th:field="*{lastName}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                            placeholder="Smith"
                            required
                            autocomplete="family-name"
                    />
                    <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                />
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="regPassword">Password</label>
                <div class="input-wrapper">
                    <input
                            type="password"
                            id="regPassword"
                            th:field="*{password}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                            placeholder="At least 8 characters"
                            required
                            autocomplete="new-password"
                    />
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility"
                            onclick="togglePassword('regPassword', this)">&#128065;</button>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="input-wrapper">
                    <input
                            type="password"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            class="form-control"
                            th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                            placeholder="Repeat your password"
                            required
                            autocomplete="new-password"
                    />
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility"
                            onclick="togglePassword('confirmPassword', this)">&#128065;</button>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a th:href="@{/login}">Log in</a></p>
        </div>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
